name: Forecast experiment

# Panache's D89 (Phase 6): PM2.5 from J+1 to J+7 at 21 cities in 8 countries. Two foundation
# models forecast without training, a job per model and country (`experiments/forecast_foundation.py`,
# on the CPU: torch stays out of every project's dependencies). Then Panache's own methods
# (climatology, persistence, LightGBM, analogs) and these are scored on the same days, each country
# calibrated on the others (`panache-forecast-experiment run`).
#
# The input table is the release `forecast-experiment-v1`'s, built by
# `panache-forecast-experiment build` (the archives and Open-Meteo's Previous Runs API).

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to score with"
        default: main
      methods:
        description: "The foundation models, as a JSON list"
        default: '["chronos2", "tabpfn_ts"]'
      every:
        description: "One issue day in this many"
        default: "1"

permissions:
  contents: read

env:
  RELEASE: forecast-experiment-v1

jobs:
  foundation:
    name: ${{ matrix.method }} ${{ matrix.country }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        method: ${{ fromJSON(inputs.methods) }}
        country: [FR, DE, IT, ES, PL, GB, CZ, GR]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Fetch the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE" --pattern forecast-experiment.parquet --dir inputs
      - name: Forecast
        env:
          METHOD: ${{ matrix.method }}
          COUNTRY: ${{ matrix.country }}
          EVERY: ${{ inputs.every }}
        run: |
          uv run --script experiments/forecast_foundation.py --data inputs/forecast-experiment.parquet \
            --method "$METHOD" --country "$COUNTRY" --every "$EVERY" \
            --out "out/$METHOD-$COUNTRY.parquet" 2>&1 | tee forecast.log
          grep -E "issue days|forecasts in" forecast.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ matrix.method }}-${{ matrix.country }}
          path: out/

  score:
    name: Score
    needs: foundation
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Fetch the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE" --pattern forecast-experiment.parquet --dir inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: foundation-*
          path: foundation
          merge-multiple: true
      - name: Keep the models that forecast every country
        run: |
          /tmp/panache/bin/python - <<'EOF'
          from pathlib import Path
          import pyarrow as pa, pyarrow.parquet as pq
          files = sorted(Path("foundation").glob("*.parquet"))
          by_method = {}
          for f in files:
              by_method.setdefault(f.stem.split("-")[0], []).append(f)
          whole = [m for m, fs in by_method.items() if len(fs) == 8]
          print(f"complete: {whole}; incomplete: {sorted(set(by_method) - set(whole))}")
          if whole:
              tables = [pq.read_table(f) for m in whole for f in by_method[m]]
              pq.write_table(pa.concat_tables(tables), "foundation-forecasts.parquet")
          EOF
      - name: Score
        run: |
          set -o pipefail
          mkdir -p out
          foundation=()
          [ -f foundation-forecasts.parquet ] && foundation=(--foundation foundation-forecasts.parquet)
          /tmp/panache/bin/panache-forecast-experiment run --data inputs/forecast-experiment.parquet \
            "${foundation[@]}" --out out/forecast-scores.json | tee out/forecast-scores.md
          cat out/forecast-scores.md >> "$GITHUB_STEP_SUMMARY"
          [ -f foundation-forecasts.parquet ] && cp foundation-forecasts.parquet out/ || true
      - name: Publish the scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE" out/* --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forecast-scores
          path: out/
