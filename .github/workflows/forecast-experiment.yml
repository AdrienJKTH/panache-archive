name: Forecast experiment

# Panache's D89 (Phase 6): PM2.5 from J+1 to J+7 at 21 cities in 8 countries. Two foundation
# models forecast without training, a job per model and country (`experiments/forecast_foundation.py`,
# on the CPU: torch stays out of every project's dependencies). Then Panache's own methods
# (climatology, persistence, LightGBM, analogs) and these are scored on the same days, each country
# calibrated on the others (`panache-forecast-experiment run`).
#
# The input table is the folder `forecast-experiment-v1`'s of the private dataset, built by
# `panache-forecast-experiment build` (the archives and Open-Meteo's Previous Runs API), and
# the forecasts and the scores go there too (`panache_archive.private`): never to a public
# release, an artifact, the log or the summary, which only count the forecasts.

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to score with"
        default: main
      methods:
        description: "The foundation models, as a JSON list"
        default: '["chronos2", "tabpfn_ts"]'
      history:
        description: "The past each forecast knows: reanalysis, or stream (CAMS's, as live)"
        default: reanalysis
      every:
        description: "One issue day in this many"
        default: "1"

permissions:
  contents: read

env:
  RELEASE: forecast-experiment-v1  # a folder of the private dataset
  FOUNDATION: foundation-runs/${{ github.run_id }}

jobs:
  foundation:
    name: ${{ matrix.method }} ${{ matrix.country }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        method: ${{ fromJSON(inputs.methods) }}
        country: [FR, DE, IT, ES, PL, GB, CZ, GR]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Fetch the table
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run panache-archive private download --folder "$RELEASE" \
          --pattern forecast-experiment.parquet --dir inputs
      - name: Forecast
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          METHOD: ${{ matrix.method }}
          COUNTRY: ${{ matrix.country }}
          EVERY: ${{ inputs.every }}
          HISTORY: ${{ inputs.history }}
        run: |
          uv run --script experiments/forecast_foundation.py --data inputs/forecast-experiment.parquet \
            --method "$METHOD" --country "$COUNTRY" --every "$EVERY" --history "$HISTORY" \
            --out "out/$METHOD-$COUNTRY.parquet" > forecast.log 2>&1 \
            || { tail -n 20 forecast.log; exit 1; }
          grep -E "issue days|forecasts in" forecast.log >> "$GITHUB_STEP_SUMMARY"
          uv run panache-archive private upload --folder "$FOUNDATION" "out/$METHOD-$COUNTRY.parquet"

  score:
    name: Score
    needs: foundation
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Fetch the table and the foundation models' forecasts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run panache-archive private download --folder "$RELEASE" \
            --pattern forecast-experiment.parquet --dir inputs
          uv run panache-archive private download --folder "$FOUNDATION" \
            --pattern '*.parquet' --dir foundation --allow-empty
      - name: Keep the models that forecast every country
        run: |
          /tmp/panache/bin/python - <<'EOF'
          from pathlib import Path
          import pyarrow as pa, pyarrow.parquet as pq
          files = sorted(Path("foundation").glob("*.parquet"))
          by_method = {}
          for f in files:
              by_method.setdefault(f.stem.split("-")[0], []).append(f)
          whole = [m for m, fs in by_method.items() if len(fs) == 8]
          print(f"complete: {whole}; incomplete: {sorted(set(by_method) - set(whole))}")
          if whole:
              tables = [pq.read_table(f) for m in whole for f in by_method[m]]
              pq.write_table(pa.concat_tables(tables), "foundation-forecasts.parquet")
          EOF
      - name: Score
        env:
          HISTORY: ${{ inputs.history }}
        run: |
          mkdir -p out
          foundation=()
          [ -f foundation-forecasts.parquet ] && foundation=(--foundation foundation-forecasts.parquet)
          /tmp/panache/bin/panache-forecast-experiment run --data inputs/forecast-experiment.parquet \
            "${foundation[@]}" --history "$HISTORY" --out "out/forecast-scores-$HISTORY.json" \
            > "out/forecast-scores-$HISTORY.md"
          [ -f foundation-forecasts.parquet ] \
            && cp foundation-forecasts.parquet "out/foundation-forecasts-$HISTORY.parquet" || true
      - name: Publish the scores, privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run panache-archive private upload --folder "$RELEASE" out/*
