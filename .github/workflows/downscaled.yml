name: Downscaled maps

# Builds Panache's daily maps of the European Air Quality Index's pollutants at 1 km over France
# (Panache's D74) into the release downscaled-v1: one `.days` file per pollutant and year, ~1 MB a
# day. Panache's own backend builds them (`panache-downscaling-maps`, checked out at the commit
# asked with the deploy key PANACHE_DEPLOY_KEY, since Panache's repository is private): it trains
# each pollutant's model once on the EEA's background stations (release downscaling-v1), then
# predicts every land cell of every day, ~25 s a day, from the archive's CAMS (cams-v1) and ERA5
# (era5-v1). A run trains the models and builds the pollutant-years the release lacks, among the
# pollutants asked (the models go to the private dataset, `panache_archive.private`,
# never to the release); with `days`, a pilot builds each year's first days as the run's artifacts,
# without touching the release's maps.

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache whose backend builds the maps"
        default: main
      years:
        description: "`all` (2013 to the last complete year), a year, or a span such as 2013-2025"
        default: all
      days:
        description: "Only each year's first days (a pilot); empty for whole years"
        default: ""
      pollutants:
        description: "The pollutants to map, a JSON list"
        default: '["pm2_5", "nitrogen_dioxide", "pm10", "ozone", "sulphur_dioxide"]'

concurrency:
  group: downscaled
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE: downscaled-v1
  # Where the maps go, in the private dataset: a pilot's in a folder of its run.
  FOLDER: ${{ inputs.days == '' && 'downscaled-v1' || format('pilots/{0}', github.run_id) }}
  PANACHE: ${{ inputs.panache }}
  DAYS: ${{ inputs.days }}
  POLLUTANTS: ${{ inputs.pollutants }}

jobs:
  train:
    name: Train the models
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Fetch the archive, every year
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-for-maps.sh data/archive all
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Train the models the private dataset lacks
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run panache-archive private list --folder "$RELEASE" > models.txt
          # A published model stays: the maps built with it would no longer match a new one.
          missing=$(jq -r --rawfile built models.txt '.[] as $pollutant
            | select(($built | split("\n")) | index("downscaling-\($pollutant).lgb.txt") | not)
            | $pollutant' <<< "$POLLUTANTS")
          if [ -z "$missing" ]; then
            echo "Every model is published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2086 # one argument per pollutant
          /tmp/panache/bin/panache-downscaling-maps --archive data/archive train \
            --pollutants $missing --out models
          uv run panache-archive private upload --folder "$RELEASE" models/*.lgb.txt
          echo "Trained: $missing" >> "$GITHUB_STEP_SUMMARY"
      - name: Plan
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YEARS: ${{ inputs.years }}
        run: |
          last=$(( $(date -u +%Y) - 1 ))
          case "$YEARS" in
            all) first=2013 ;;
            *-*) first=${YEARS%-*} last=${YEARS#*-} ;;
            *) first=$YEARS last=$YEARS ;;
          esac
          uv run panache-archive private list --folder "$RELEASE" > built.txt
          matrix=$(jq -nc --argjson first "$first" --argjson last "$last" \
            --rawfile built built.txt --arg pilot "$DAYS" --argjson pollutants "$POLLUTANTS" '
            [range($first; $last + 1) as $year
             | $pollutants[] as $pollutant
             | select($pilot != ""
                 or (($built | split("\n")) | index("downscaled-\($pollutant)-\($year).days") | not))
             | {pollutant: $pollutant, year: $year}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '"\(length) pollutant-years to build"' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.pollutant }} ${{ matrix.year }}
    needs: train
    if: needs.train.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.train.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Fetch the archive's year and the models
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          scripts/fetch-for-maps.sh data/archive "${{ matrix.year }}"
          uv run panache-archive private download --folder "$RELEASE" --pattern "*.lgb.txt" --dir models
      - name: Build
        run: >
          /tmp/panache/bin/panache-downscaling-maps --archive data/archive
          year --pollutant "${{ matrix.pollutant }}" --year "${{ matrix.year }}" --models models
          ${DAYS:+--days "$DAYS"} --out dist
      - name: Publish, privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run panache-archive private upload --folder "$FOLDER" dist/*.days
