name: ETEX
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.pull_request.title || 'ETEX' }}

# Builds ERA5's winds and boundary layer for October 1994, the month of ETEX-1 (the European
# tracer experiment: PMCH released at Monterfil, Brittany, on 23-24 October 1994), so that
# Panache's trajectories and footprints can be scored against the tracer's measurements
# (Panache's D112, step 2 of its cross-validation). The files are those of winds-europe-v1 and
# surface-europe-v1, in the same format, published to a release of their own, etex-v1, so that
# the product's archives keep holding 2013 onwards only. Beside them, the tracer's measurements
# from NOAA ARL's DATEM archive and ARL's page of HYSPLIT's ranks (US government work, public
# domain), read from web archives: arl.noaa.gov's CloudFront answers 403 to scripts and no longer
# lists the files (2026-11-28). Run by hand; a run again rebuilds and replaces every file (~320
# and ~85 MB, and ~175 kB of archived pages, each checked against its SHA-256).

on:
  workflow_dispatch:

concurrency:
  group: etex
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE: etex-v1
  YEAR: 1994
  MONTH: 10

jobs:
  build:
    name: ${{ matrix.kind }} 1994-10
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        kind: [winds, surface]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$RELEASE" > /dev/null 2>&1
          || gh release create "$RELEASE" --title "ERA5 over Europe in October 1994, for ETEX-1"
          --notes-file docs/etex-release.md
          || gh release view "$RELEASE" > /dev/null
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.kind }}
        run: |
          set -o pipefail
          start=$SECONDS
          path=$(uv run panache-archive "$KIND-build" --year "$YEAR" --month "$MONTH" --out dist \
            | tail -1)
          gh release upload "$RELEASE" "$path" --clobber
          echo "| $(basename "$path") | $(du -m "$path" | cut -f1) MB |" \
            "$((SECONDS - start)) s |" >> "$GITHUB_STEP_SUMMARY"

  datem:
    name: DATEM's ETEX-1 files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$RELEASE" > /dev/null 2>&1
          || gh release create "$RELEASE" --title "ERA5 over Europe in October 1994, for ETEX-1"
          --notes-file docs/etex-release.md
          || gh release view "$RELEASE" > /dev/null
      - name: Fetch, check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The Internet Archive's captures of DATEM's ETEX directory (20 January 2009), and the
        # University of North Texas's End of Term 2008 capture of ARL's DATEM_results.php.
        run: |
          set -o pipefail
          mkdir datem
          while read -r name sha url; do
            curl --fail --silent --show-error --location --retry 3 --output "datem/$name" "$url"
            echo "$sha  datem/$name" | sha256sum --check --strict
          done <<'FILES'
          etex-meas-t1.txt 149fe7a6680103eb1dd0b78c6c3878546a307e6140bcef4333bbbf30f3b7685b https://web.archive.org/web/20090120225653id_/http://www.arl.noaa.gov/documents/datem/exp_data/etex/meas-t1.txt
          etex-readme.txt 103b10e43d83ef69cb579506d2616d503823a62fc2045530a1470c85bb83dd30 https://web.archive.org/web/20090120225520id_/http://www.arl.noaa.gov/documents/datem/exp_data/etex/readme.txt
          etex-stations.txt 2d68cbf26db030052fb1ac097f8ba75a2190f638bb69d4c1793a663bd8510bfc https://web.archive.org/web/20090120225822id_/http://www.arl.noaa.gov/documents/datem/exp_data/etex/stations.txt
          hysplit-datem-results.html 95d9c016135a9b57ede77e96051b20bb166f653f7b0955776fe36728ad6e8ebb https://webarchive.library.unt.edu/eot2008/20081004073932id_/http://www.arl.noaa.gov/DATEM_results.php
          FILES
          echo "| File | Bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for path in datem/*; do
            echo "| $(basename "$path") | $(stat -c %s "$path") |" >> "$GITHUB_STEP_SUMMARY"
          done
          gh release upload "$RELEASE" datem/* --clobber
