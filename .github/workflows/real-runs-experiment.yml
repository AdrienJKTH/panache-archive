name: Real runs experiment

# Panache's D130: what does the PM2.5 forecast score on the runs it really reads? A job per month
# reads ECMWF IFS's 00 UTC runs of 6 March 2024 to 30 December 2025 at the experiment's 21 cities
# from ECMWF's open data on AWS (~320 MB a run, ~216 GB in all; `experiments/ecmwf_points.py`),
# plus three recent runs. Panache's `panache-live-runs-experiment` then compares the recent ones
# with Open-Meteo's bucket, which the live service reads, and scores D98's LightGBM on them all.
#
# What is read and what comes out is Panache's: into the private dataset's
# `real-runs-experiment-v1` (`panache_archive.private`), never to a release, an artifact, the log
# or the summary.
on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to score with"
        default: main

permissions:
  contents: read

env:
  SOURCE: forecast-experiment-v1
  RELEASE: real-runs-experiment-v1  # a folder of the private dataset
  PANACHE_REF: ${{ inputs.panache || 'main' }}

jobs:
  points:
    name: Points ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: "ifs-2024-03", first: "2024-03-06", last: "2024-03-31"}
          - {name: "ifs-2024-04", first: "2024-04-01", last: "2024-04-30"}
          - {name: "ifs-2024-05", first: "2024-05-01", last: "2024-05-31"}
          - {name: "ifs-2024-06", first: "2024-06-01", last: "2024-06-30"}
          - {name: "ifs-2024-07", first: "2024-07-01", last: "2024-07-31"}
          - {name: "ifs-2024-08", first: "2024-08-01", last: "2024-08-31"}
          - {name: "ifs-2024-09", first: "2024-09-01", last: "2024-09-30"}
          - {name: "ifs-2024-10", first: "2024-10-01", last: "2024-10-31"}
          - {name: "ifs-2024-11", first: "2024-11-01", last: "2024-11-30"}
          - {name: "ifs-2024-12", first: "2024-12-01", last: "2024-12-31"}
          - {name: "ifs-2025-01", first: "2025-01-01", last: "2025-01-31"}
          - {name: "ifs-2025-02", first: "2025-02-01", last: "2025-02-28"}
          - {name: "ifs-2025-03", first: "2025-03-01", last: "2025-03-31"}
          - {name: "ifs-2025-04", first: "2025-04-01", last: "2025-04-30"}
          - {name: "ifs-2025-05", first: "2025-05-01", last: "2025-05-31"}
          - {name: "ifs-2025-06", first: "2025-06-01", last: "2025-06-30"}
          - {name: "ifs-2025-07", first: "2025-07-01", last: "2025-07-31"}
          - {name: "ifs-2025-08", first: "2025-08-01", last: "2025-08-31"}
          - {name: "ifs-2025-09", first: "2025-09-01", last: "2025-09-30"}
          - {name: "ifs-2025-10", first: "2025-10-01", last: "2025-10-31"}
          - {name: "ifs-2025-11", first: "2025-11-01", last: "2025-11-30"}
          - {name: "ifs-2025-12", first: "2025-12-01", last: "2025-12-30"}
          - {name: "parity-2026-09-15", first: "2026-09-15", last: "2026-09-15"}
          - {name: "parity-2026-10-15", first: "2026-10-15", last: "2026-10-15"}
          - {name: "parity-2026-11-15", first: "2026-11-15", last: "2026-11-15"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ env.PANACHE_REF }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: The experiment's places
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
          /tmp/panache/bin/python - <<'EOF'
          import json
          from pathlib import Path
          from panache.forecast.places import PLACES
          places = [{"name": p.name, "lat": p.point.lat, "lon": p.point.lon} for p in PLACES]
          Path("places.json").write_text(json.dumps(places))
          EOF
      - name: Read IFS's runs
        env:
          NAME: ${{ matrix.name }}
          FIRST: ${{ matrix.first }}
          LAST: ${{ matrix.last }}
        run: |
          set -o pipefail
          uv run --script experiments/ecmwf_points.py --model ifs --first "$FIRST" --last "$LAST" \
            --places places.json --out "out/$NAME.parquet" 2>&1 | tee points.log
          grep -E "runs read" points.log >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the points, privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NAME: ${{ matrix.name }}
        run: |
          uv sync --locked
          uv run panache-archive private upload --folder "$RELEASE" "out/$NAME.parquet"

  score:
    name: Score
    needs: points
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ env.PANACHE_REF }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend and the archive's tools
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
          uv sync --locked
      - name: Fetch the table and the points
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run panache-archive private download --folder "$SOURCE" \
            --pattern forecast-experiment.parquet --dir inputs
          uv run panache-archive private download --folder "$RELEASE" \
            --pattern "ifs-*.parquet" --dir inputs/ifs
          uv run panache-archive private download --folder "$RELEASE" \
            --pattern "parity-*.parquet" --dir inputs/parity
      - name: Compare with the bucket, then score
        run: |
          # What comes out is Panache's: into the private dataset, not into the public log.
          mkdir -p out
          /tmp/panache/bin/panache-live-runs-experiment parity --runs inputs/parity \
            --out out/parity.json > out/parity.md
          /tmp/panache/bin/panache-live-runs-experiment score \
            --data inputs/forecast-experiment.parquet --runs inputs/ifs \
            --out out/real-runs-scores.json > out/real-runs-summary.md
          echo "Scored" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the scores, privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run panache-archive private upload --folder "$RELEASE" \
            out/parity.json out/parity.md out/real-runs-scores.json out/real-runs-summary.md
