name: Live maps

# Builds today to J+3 of Panache's map from CAMS Europe's daily run (Panache's D80) into the
# release maps-live-v1: one `.days` file a run, ~30 KB, then `live.json`, which names the latest
# run and which a reader takes first. The run comes from Open-Meteo's public bucket, ~50 MB, about
# 11:35 UTC. Panache's own backend classes it (`panache-domain-maps`, checked out with the deploy
# key PANACHE_DEPLOY_KEY, since Panache's repository is private).
#
# It starts several times a day, as GitHub's cron is late at times and a run may come out late: a
# run already published is left alone, so a start with nothing new takes under a minute. A run's
# file never changes once published; files of runs older than KEEP_DAYS are deleted.

on:
  schedule:
    - cron: "5 12,14,17,21 * * *"
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache whose backend builds the map"
        default: main

concurrency:
  group: live-maps
  cancel-in-progress: false

permissions:
  contents: write # the release

env:
  RELEASE: maps-live-v1
  KEEP_DAYS: 7
  GH_TOKEN: ${{ github.token }}

jobs:
  live:
    name: Build the latest run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache || 'main' }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Is there a new run?
        id: run
        run: |
          latest=$(/tmp/panache/bin/panache-domain-maps latest-run)
          published=$(gh release download "$RELEASE" --pattern live.json --output - 2> /dev/null \
            | jq -r .run || true)
          echo "The bucket's latest run: $latest; published: ${published:-none}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$latest" != "$published" ]]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        if: steps.run.outputs.new == 'true'
        run: |
          /tmp/panache/bin/panache-domain-maps live --out dist --work "$RUNNER_TEMP/work" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          du -ch dist/*.days | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: steps.run.outputs.new == 'true'
        run: |
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" --title "Panache's map of today and the next days" \
              --notes-file docs/maps-live-release.md --latest=false
          # The run's file first: `live.json` names it.
          gh release upload "$RELEASE" dist/*.days --clobber
          gh release upload "$RELEASE" dist/live.json --clobber
      - name: Delete old runs
        if: steps.run.outputs.new == 'true'
        run: |
          oldest=$(date -u -d "$KEEP_DAYS days ago" +%F)
          for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" \
              --jq '.assets[].name | select(endswith(".days"))'); do
            day=${asset##*-run-}
            day=${day%.days}
            if [[ "$day" < "$oldest" ]]; then
              gh release delete-asset "$RELEASE" "$asset" --yes
            fi
          done
