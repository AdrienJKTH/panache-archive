name: Live maps

# Builds Panache's map of the present (Panache's D80) into the release maps-live-v1: today to J+3
# from CAMS Europe's daily run, one `.days` file a run, ~30 KB; the days between the archive and
# the run from CAMS's daily stream, one `.days` file a year, ~2 MB; then `live.json`, which names
# them and which a reader takes first. Both come from Open-Meteo's public bucket, the run out about
# 11:35 UTC. Panache's own backend builds them (`panache-domain-maps live`, checked out with the
# deploy key PANACHE_DEPLOY_KEY, since Panache's repository is private), and writes only what
# changed since the last publication.
#
# It starts every hour, as GitHub's cron is late by hours or skips starts at times (seen on
# 2026-11-08) and a run may come out late; a start with nothing new takes under a minute. A published file never changes: the stream's year
# grows as a new file named after its last day, and a first fill of the year takes a few passes of
# three months each. Files that neither `live.json` nor the pointer it replaced name are
# deleted after KEEP_DAYS.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache whose backend builds the map"
        default: main

concurrency:
  group: live-maps
  cancel-in-progress: false

permissions:
  contents: write # the release

env:
  RELEASE: maps-live-v1
  KEEP_DAYS: 7
  GH_TOKEN: ${{ github.token }}

jobs:
  live:
    name: Build and publish what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        # With `shell: bash` named, a step runs with `-eo pipefail`: a failing command before
        # `| tee` fails the step (on 2026-11-08 a failed pass was taken for a success).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache || 'main' }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Build what changed
        id: build
        run: |
          /tmp/panache/bin/panache-domain-maps live --out dist --work "$RUNNER_TEMP/work" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -f dist/live.json ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            du -ch dist/* | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish
        if: steps.build.outputs.changed == 'true'
        run: |
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" --title "Panache's map of today and the next days" \
              --notes-file docs/maps-live-release.md --latest=false
          # The pointer being replaced: its files are kept a pass longer (the next step).
          gh release download "$RELEASE" --pattern live.json --output previous.json 2> /dev/null \
            || echo '{}' > previous.json
          # The files first: `live.json` names them.
          if compgen -G "dist/*.days" > /dev/null; then
            gh release upload "$RELEASE" dist/*.days --clobber
          fi
          gh release upload "$RELEASE" dist/live.json --clobber
      - name: Delete the files live.json no longer names
        if: steps.build.outputs.changed == 'true'
        run: |
          oldest=$(date -u -d "$KEEP_DAYS days ago" +%F)
          # What the new pointer names, and what the one it replaced named: a reader that took the
          # previous pointer a moment ago, or from the mirror a pass behind, still finds its files.
          named=$(jq -r '(.layers // {} | .[]), (.stream // [] | .[] | .asset)' \
            dist/live.json previous.json)
          for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" \
              --jq '.assets[].name | select(endswith(".days"))'); do
            if grep -qxF "$asset" <<< "$named"; then continue; fi
            # Each name ends with its last day: a run's start, a stream's last day.
            day=${asset%.days}
            day=${day: -10}
            if [[ "$day" < "$oldest" ]]; then
              gh release delete-asset "$RELEASE" "$asset" --yes
            fi
          done
