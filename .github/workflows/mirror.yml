name: Mirror

# Keeps the whole domain's releases mirrored on Hugging Face (Panache's D66, D71): the public
# dataset adrien4916/air_qual_indicators, one folder per release (cams-europe-v1,
# era5-europe-v1, merra2-europe-v1), which Panache reads when GitHub fails. After each CAMS, ERA5
# or MERRA-2 run and every
# three hours, it uploads what the mirror lacks or holds otherwise, deletes what a release
# dropped, and keeps the dataset card. A run with nothing to do costs two listings a release.

on:
  workflow_run:
    workflows: [CAMS, ERA5, MERRA-2]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror on Hugging Face
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Mirror each release
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for release in cams-europe-v1 era5-europe-v1 merra2-europe-v1; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release" > release.json \
              || echo '{"assets": []}' > release.json
            echo "**$release**: $(uv run panache-archive mirror --release release.json \
              --folder "$release" --card docs/hugging-face-card.md --workdir "$RUNNER_TEMP")" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
