name: Footprint validation

# Panache's D86: are the footprints' contributions true? Each site of RI-URBANS's AE33 series
# (`sources-v1`) gets the footprints of its sampled days, one job a site
# (`panache-footprint-validation run`): the footprint of the day's mean times CAMS-GLOB-ANT's
# black carbon (with its months and without), and EDGAR's primary PM2.5, from `winds-europe-v1`,
# `surface-europe-v1` and `emissions-v1` read over HTTP ranges. The sensitivity runs each
# variant on six sites' first days. The report joins the rows with the measured eBC, its split
# and the nearest PM2.5 station of `downscaling-europe-v1`, and scores them. `variant` runs a full
# variant (the near field) at every site instead of the base; `rows_run` adds earlier runs' rows
# (the base's, to pair with it).

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to run"
        default: main
      variant:
        description: "The variant run at every site's days and scored in full (base, near field)"
        default: base
      days:
        description: "Days a site"
        default: "100"
      include:
        description: "Days computed first wherever measured (ISO dates, space separated)"
        default: "2016-12-01"
      sensitivity:
        description: "Run the sensitivity's variants too"
        type: boolean
        default: true
      compute:
        description: "Compute rows (else only report on earlier runs' rows)"
        type: boolean
        default: true
      rows_run:
        description: "Only report, on the rows of these earlier runs (ids, space separated)"
        default: ""

concurrency:
  group: footprint-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Plan
    if: inputs.compute
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Take the measured split
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download sources-v1 --repo "$GITHUB_REPOSITORY" --dir inputs
          --pattern "ri-urbans-ebc.parquet"
      - name: List the sites
        id: sites
        run: echo "sites=$(/tmp/panache/bin/panache-footprint-validation sites --inputs inputs)" >> "$GITHUB_OUTPUT"

  base:
    name: Site ${{ matrix.site }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Take the measured split
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download sources-v1 --repo "$GITHUB_REPOSITORY" --dir inputs
          --pattern "ri-urbans-ebc.parquet"
      - name: Footprints
        env:
          SITE: ${{ matrix.site }}
          VARIANT: ${{ inputs.variant }}
          DAYS: ${{ inputs.days }}
          INCLUDE: ${{ inputs.include }}
        run: |
          mkdir -p rows
          # shellcheck disable=SC2086 # the days are words
          /tmp/panache/bin/panache-footprint-validation run --inputs inputs --site "$SITE" \
            --variant "$VARIANT" --days "$DAYS" --include $INCLUDE --minutes 270 \
            --out "rows/site-$SITE.jsonl" 2>&1 | grep -v "HTTP Request" | tee run.log
          tail -1 run.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rows-site-${{ matrix.site }}
          path: rows/
          retention-days: 30

  sensitivity:
    name: ${{ matrix.variant }}
    needs: plan
    if: inputs.compute && inputs.sensitivity
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant:
          - particles 500
          - particles 4000
          - another seed
          - released at 100 m
          - released at 12:30 only
          - released at 00:30 only
          - released every 6 h
          - layer floor 50 m
          - layer floor 200 m
          - layer x 0.7
          - layer x 1.3
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Take the measured split
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download sources-v1 --repo "$GITHUB_REPOSITORY" --dir inputs
          --pattern "ri-urbans-ebc.parquet"
      - name: Footprints
        env:
          VARIANT: ${{ matrix.variant }}
          INCLUDE: ${{ inputs.include }}
          INDEX: ${{ strategy.job-index }}
        run: |
          mkdir -p rows
          # shellcheck disable=SC2086 # the days are words
          /tmp/panache/bin/panache-footprint-validation run --inputs inputs --variant "$VARIANT" \
            --include $INCLUDE --minutes 300 --out "rows/variant-$INDEX.jsonl" 2>&1 \
            | grep -v "HTTP Request" | tee run.log
          tail -1 run.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rows-variant-${{ strategy.job-index }}
          path: rows/
          retention-days: 30

  report:
    name: Report
    needs: [base, sensitivity]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Take this run's rows
        if: inputs.compute
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rows-*
          path: rows
      - name: Take the measurements, and earlier runs' rows
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS_RUN: ${{ inputs.rows_run }}
          VARIANT: ${{ inputs.variant }}
        run: |
          gh release download sources-v1 --repo "$GITHUB_REPOSITORY" --dir inputs \
            --pattern "ri-urbans-ebc.parquet"
          gh release download downscaling-europe-v1 --repo "$GITHUB_REPOSITORY" --dir inputs \
            --pattern "stations-*-pm2_5.parquet"
          for run in $ROWS_RUN; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern "rows-*" \
              --dir "rows/$run"
          done
          find rows -name "*.jsonl" | wc -l
      - name: Report
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -o pipefail
          mkdir -p out
          /tmp/panache/bin/panache-footprint-validation report --inputs inputs --rows rows \
            --variant "$VARIANT" --out out/scores.json | tee out/report.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          cp -r rows out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: footprint-validation
          path: out/
          retention-days: 30
