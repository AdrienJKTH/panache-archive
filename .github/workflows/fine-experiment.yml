name: Fine experiment

# Measures Panache's downscaling below 1 km (Panache's D74): its 1 km model against the same with
# the fine features read from ~300 m up and from the cell up (~100 m), on background and traffic
# stations it never saw; then maps two towns at ~100 m on a day. The table goes to the run's
# summary, the results and images to its artifact. The fine layers come from the release fine-v1,
# or from a pilot run's artifact (fine_run).

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to run"
        default: main
      fine_run:
        description: "A run of `Fine layers` whose artifact holds the tiles; empty for fine-v1"
        default: ""
      pollutant:
        description: "pm2_5 or nitrogen_dioxide"
        default: pm2_5

permissions:
  contents: read
  actions: read

jobs:
  experiment:
    name: Experiment and towns
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Fetch the archive and the fine layers
        env:
          GH_TOKEN: ${{ github.token }}
          FINE_RUN: ${{ inputs.fine_run }}
        run: |
          scripts/fetch-for-maps.sh data/archive all
          if [ -n "$FINE_RUN" ]; then
            gh run download "$FINE_RUN" -n fine -D data/fine
          else
            gh release download fine-v1 -p "fine-*.npz" -D data/fine
          fi
          ls data/fine | wc -l
      - name: Experiment
        env:
          POLLUTANT: ${{ inputs.pollutant }}
        run: |
          mkdir -p out
          /tmp/panache/bin/panache-downscaling-experiment --archive data/archive \
            --fine data/fine --pollutants "$POLLUTANT" --out out/experiment.json \
            | tee out/experiment.md
          cat out/experiment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Towns
        env:
          POLLUTANT: ${{ inputs.pollutant }}
        run: |
          town() {  # name, day, south, north, west, east
            /tmp/panache/bin/panache-downscaling-fine --archive data/archive --fine data/fine \
              --pollutant "$POLLUTANT" --day "$2" --box "$3" "$4" "$5" "$6" --out "out/$1" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          }
          town paris 2016-12-01 48.78 48.94 2.20 2.50
          town lyon 2021-02-06 45.70 45.82 4.76 4.94
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fine-experiment
          path: out/
