name: Live innovations

# Keeps, for each station of the live step (Panache's D90, D92), its innovations over the past year
# (Panache's D95): the station's daily value and CAMS's daily stream at its position, read between
# the four cell centres around it, one Parquet asset per pollutant in the release
# innovations-live-v1, trimmed to its last 366 days. A day's day-to-day innovations, which the
# analysis of the live step assimilates, come out of that asset and the day's asset of
# stations-live-v1 (`panache-assimilation-innovations day`); the run writes the last day's to its
# summary. Panache's own backend does the work (checked out with the deploy key
# PANACHE_DEPLOY_KEY, since Panache's repository is private).
#
# With `seed`, the asset starts again: from the fields D90's experiment read (2024-2025, the
# validated stations; artifacts of `Assimilation experiment`'s runs below, kept 90 days from
# 2026-11-12), then the live stations of `first_day` to `last_day`, built here by
# `panache-archive live-stations` (one download pass however many days) rather than read from
# stations-live-v1, which keeps 300 days. Otherwise it grows from the release's live days of
# `first_day` to `last_day` (default: the three days before today, the days `Live stations`
# rebuilds each morning), a later build of a day replacing the earlier one.
#
# Each morning once `Live stations` has succeeded (Adrien's go, 2026-11-22), with the defaults
# above; by hand for a seed or other days.

on:
  workflow_run:
    workflows: ["Live stations"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to run"
        default: main
      seed:
        description: "Start again from D90's fields and the live stations built here"
        type: boolean
        default: false
      first_day:
        description: "The first live UTC day, ISO (default: three days ago; with seed: 1 January)"
        default: ""
      last_day:
        description: "The last live UTC day, ISO (default: yesterday)"
        default: ""

concurrency:
  group: live-innovations
  cancel-in-progress: false

permissions:
  contents: write # the release
  actions: read # the fields' artifacts

env:
  RELEASE: innovations-live-v1
  STATIONS: stations-live-v1
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.pollutant }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - pollutant: pm2_5
            fields_run: "43597317843"
          - pollutant: pm10
            fields_run: "43597323529"
          - pollutant: ozone
            fields_run: "43597328744"
    env:
      POLLUTANT: ${{ matrix.pollutant }}
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache || 'main' }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: The days
        id: days
        run: |
          if [[ "$SEED" == true ]]; then default_first=$(date -u +%Y)-01-01
          else default_first=$(date -u -d '3 days ago' +%F); fi
          first="${{ inputs.first_day }}"; last="${{ inputs.last_day }}"
          echo "first=${first:-$default_first}" >> "$GITHUB_OUTPUT"
          echo "last=${last:-$(date -u -d yesterday +%F)}" >> "$GITHUB_OUTPUT"
      - name: Fetch the fields or the ledger, and the live stations
        env:
          FIELDS_RUN: ${{ matrix.fields_run }}
          FIRST: ${{ steps.days.outputs.first }}
          LAST: ${{ steps.days.outputs.last }}
        run: |
          mkdir -p fields ledger stations
          if [[ "$SEED" == true ]]; then
            gh run download "$FIELDS_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "assimilation-fields-$POLLUTANT" --dir fields
            uv sync --locked
            uv run panache-archive live-stations --pollutant "$POLLUTANT" \
              --first-day "$FIRST" --last-day "$LAST" --out stations 2> stations.log | tail -3
          else
            gh release download "$RELEASE" --pattern "innovations-$POLLUTANT.parquet" --dir ledger
            day="$FIRST"
            while [[ ! "$day" > "$LAST" ]]; do
              gh release download "$STATIONS" --dir stations \
                --pattern "stations-live-$POLLUTANT-$day.parquet" 2> /dev/null \
                || echo "no live day $day" >> "$GITHUB_STEP_SUMMARY"
              day=$(date -u -d "$day + 1 day" +%F)
            done
          fi
          ls -l fields ledger stations | tail -8
      - name: Update the ledger
        run: |
          args=(update --pollutant "$POLLUTANT" --stations stations --out dist)
          if [[ "$SEED" == true ]]; then args+=(--fields "fields/fields-$POLLUTANT.npz")
          else args+=(--ledger "ledger/innovations-$POLLUTANT.parquet"); fi
          {
            echo "### $POLLUTANT"
            /tmp/panache/bin/panache-assimilation-innovations "${args[@]}" 2> update.log
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The last live day's day-to-day innovations, from the two assets
        run: |
          last=$(find stations -name "stations-live-$POLLUTANT-*.parquet" | sort | tail -1)
          if [[ -z "$last" ]]; then echo "no live day" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          day=$(basename "$last" .parquet); day=${day: -10}
          /tmp/panache/bin/panache-assimilation-innovations day --pollutant "$POLLUTANT" \
            --ledger "dist/innovations-$POLLUTANT.parquet" --stations "$last" --day "$day" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: innovations-${{ matrix.pollutant }}
          path: |
            dist/*.parquet
            *.log
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: innovations-*
          path: artifacts
      - name: Upload
        run: |
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" --title "Each station's innovations over its past year" \
              --notes-file docs/innovations-live-release.md --latest=false
          # Each artifact keeps its own `dist/` (beside its logs).
          mapfile -t assets < <(find artifacts -name 'innovations-*.parquet')
          if (( ${#assets[@]} == 0 )); then echo "no asset built" >&2; exit 1; fi
          gh release upload "$RELEASE" "${assets[@]}" --clobber
          echo "assets uploaded: ${#assets[@]}" >> "$GITHUB_STEP_SUMMARY"
