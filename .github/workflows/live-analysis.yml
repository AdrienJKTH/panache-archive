name: Live analysis

# The live step's step 3 (Panache's D90, D95, D97): CAMS's daily stream corrected by the day's
# stations, on every cell of the map. Panache's own backend does the work (`panache-domain-maps`,
# checked out with the deploy key PANACHE_DEPLOY_KEY, since Panache's repository is private), from
# the ledgers of innovations-live-v1 (each station's value and the stream at it, D95):
#
# - `covariances`: the covariance model of each pollutant, fitted once from the ledgers' year and
#   written to the summary, to be kept as numbers in Panache's `domain_maps.analysed.MODELS`;
# - `analyse`: the analysed days since the last publication of maps-analysed-v1, one `.days` file
#   a year and colouring (EAQI, unusual), one a year and pollutant for the analysis's spread on a
#   1° grid, then `analysed.json`, which names them; `first_day` starts a first publication;
# - `check`: D90's scores again over `first_day` to `last_day`, stations held out by 0.5° block.
#
# `analyse` is dispatched by `Live innovations` once it has succeeded (Adrien's go, 2026-11-22):
# a run the workflow token started raises no `workflow_run`, so each step dispatches the next.
# The other commands by hand.

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to run"
        default: main
      command:
        description: "covariances, analyse or check"
        type: choice
        options: [analyse, covariances, check]
        default: analyse
      first_day:
        description: "check: the first day; analyse: the first day of a first publication"
        default: ""
      last_day:
        description: "check: the last day; analyse: the last day (default: the ledgers')"
        default: ""

concurrency:
  group: live-analysis
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE: maps-analysed-v1
  LEDGERS: innovations-live-v1
  KEEP_DAYS: 7
  GH_TOKEN: ${{ github.token }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # The run's logs and results, in the private dataset: never an artifact or a summary.
  RUNS: live-analysis-runs/${{ github.run_id }}

defaults:
  run:
    shell: bash

jobs:
  run:
    name: ${{ inputs.command || 'analyse' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      COMMAND: ${{ inputs.command || 'analyse' }}
      FIRST: ${{ inputs.first_day }}
      LAST: ${{ inputs.last_day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache || 'main' }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Fetch the ledgers
        run: |
          uv run panache-archive private download --folder "$LEDGERS" --pattern 'innovations-*.parquet' --dir ledgers
          ls -l ledgers
      - name: Run
        id: run
        run: |
          maps=/tmp/panache/bin/panache-domain-maps
          case "$COMMAND" in
            covariances)
              "$maps" covariances --ledgers ledgers > covariances.jsonl
              echo "Covariances: $(wc -l < covariances.jsonl) lines, in the private dataset" \
                >> "$GITHUB_STEP_SUMMARY" ;;
            check)
              "$maps" check --ledgers ledgers --first-day "$FIRST" --last-day "$LAST" \
                > checked.jsonl
              echo "Check: $(wc -l < checked.jsonl) lines, in the private dataset" \
                >> "$GITHUB_STEP_SUMMARY" ;;
            analyse)
              args=(analyse --ledgers ledgers --out dist --work "$RUNNER_TEMP/work")
              if [[ -n "$FIRST" ]]; then args+=(--first-day "$FIRST"); fi
              if [[ -n "$LAST" ]]; then args+=(--last-day "$LAST"); fi
              "$maps" "${args[@]}" 2> analyse.log | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ -f dist/analysed.json ]]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                du -ch dist/* | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
              fi ;;
          esac
      - name: Keep the run's logs and results, privately
        if: always()
        run: |
          files=$(ls *.jsonl *.log 2> /dev/null || true)
          if [[ -n "$files" ]]; then uv run panache-archive private upload --folder "$RUNS" $files; fi
      - name: Publish, privately
        if: steps.run.outputs.changed == 'true'
        run: |
          uv run panache-archive private download --folder "$RELEASE" --pattern analysed.json --dir previous \
            --allow-empty > /dev/null
          if [[ -f previous/analysed.json ]]; then mv previous/analysed.json previous.json
          else echo '{}' > previous.json; fi
          # The files first: `analysed.json` names them.
          uv run panache-archive private upload --folder "$RELEASE" dist/*.days
          uv run panache-archive private upload --folder "$RELEASE" dist/analysed.json
      - name: Delete the files analysed.json no longer names
        if: steps.run.outputs.changed == 'true'
        run: |
          oldest=$(date -u -d "$KEEP_DAYS days ago" +%F)
          # What the new pointer and the one it replaced name: a reader that took the previous
          # one a moment ago still finds its files.
          named=$(jq -r '(.days // [] | .[].asset), (.spreads // [] | .[].asset)' \
            dist/analysed.json previous.json)
          old=()
          for asset in $(uv run panache-archive private list --folder "$RELEASE" | grep "\.days$"); do
            if grep -qxF "$asset" <<< "$named"; then continue; fi
            day=${asset%.days}
            day=${day: -10}
            if [[ "$day" < "$oldest" ]]; then old+=("$asset"); fi
          done
          if (( ${#old[@]} > 0 )); then uv run panache-archive private delete --folder "$RELEASE" "${old[@]}"; fi
