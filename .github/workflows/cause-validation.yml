name: Cause validation

# How often is Panache's map of causes right? Each country's background stations (PM10, and PM2.5
# where reported; `downscaling-europe-v1`) are held against the map's dust and smoke calls of
# 2016-2025 (`maps-europe-v1`), one job a country (`panache-validate-causes shard`); a last job
# scores the documented episodes of Panache's benchmark and D85's corpus against the map and the
# stations near them, and writes the report (`panache-validate-causes report`). Panache's own
# backend does the work (checked out at the commit asked, with the deploy key PANACHE_DEPLOY_KEY),
# from this repository's releases alone. Nothing is published: the run's artifact is the report,
# its shards and the episodes' file.

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache whose backend runs the validation"
        default: main

concurrency:
  group: cause-validation
  cancel-in-progress: false

permissions:
  contents: read

env:
  PANACHE: ${{ inputs.panache }}

jobs:
  plan:
    name: Plan the countries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      countries: ${{ steps.plan.outputs.countries }}
    steps:
      - name: List the countries with PM10 stations
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          countries=$(gh release view downscaling-europe-v1 --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name | capture("^stations-(?<c>[a-z]+)-pm10\\.parquet$").c | ascii_upcase]' \
            | jq -c 'sort')
          echo "countries=$countries" >> "$GITHUB_OUTPUT"
          echo "Countries $countries, Panache at $PANACHE" >> "$GITHUB_STEP_SUMMARY"

  shard:
    name: ${{ matrix.country }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJSON(needs.plan.outputs.countries) }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: The country's stations against the map
        run: |
          /tmp/panache/bin/panache-validate-causes shard --country "${{ matrix.country }}" \
            --work "$RUNNER_TEMP/work" --out "shards/${{ matrix.country }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.country }}
          path: shards/
          retention-days: 30

  report:
    name: Documented episodes and report
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Take the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: The documented episodes
        run: |
          mkdir -p out
          /tmp/panache/bin/panache-validate-causes documented \
            --corpus panache/docs/benchmark-corpus/corpus.jsonl \
            --work "$RUNNER_TEMP/work" --out out/documented.json
      - name: The report
        run: |
          ls shards | wc -l
          /tmp/panache/bin/panache-validate-causes report --shards shards \
            --documented out/documented.json --out out/cause-validation.md
          cp -r shards out/
          head -c 6000 out/cause-validation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cause-validation
          path: out/
          retention-days: 30
