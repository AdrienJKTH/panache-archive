name: Forecast models
# Panache's D98, step 2: the product's PM2.5 forecast, J+1 to J+7 at any place of the CAMS Europe
# domain. Seven LightGBM boosters, one per lead, trained on the 21 cities' 2014-2023 (ERA5 as a
# perfect forecast, CAMS's stream as the past where it exists), and their calibration: per lead,
# the quantiles of the errors of the country-held-out run on March 2024 to December 2025, the
# archived IFS runs as the forecast (`panache-forecast-experiment train`).
#
# The input table is the private folder `forecast-experiment-v1`'s; the models go to the private
# dataset's `forecast-models-v1` (`panache_archive.private`): never to a public release, nor to an
# artifact, nor to the log.
on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to train with"
        default: main

permissions:
  contents: read

env:
  SOURCE: forecast-experiment-v1
  RELEASE: forecast-models-v1  # a folder of the private dataset

jobs:
  train:
    name: Train
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Fetch the table
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run panache-archive private download --folder "$SOURCE" --pattern forecast-experiment.parquet --dir inputs
      - name: Train
        run: |
          # The held-out scores and the analogs' weights are the model's: into the private
          # dataset with it, not into the public log or summary.
          /tmp/panache/bin/panache-forecast-experiment train \
            --data inputs/forecast-experiment.parquet --out out > out/summary.md
          echo "Trained: $(ls out/lightgbm-j*.txt | wc -l) boosters" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the models, privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          uv run panache-archive private upload --folder "$RELEASE" out/lightgbm-j*.txt out/forecast-models.json out/summary.md
