name: Forecast models
# Panache's D98, step 2: the product's PM2.5 forecast, J+1 to J+7 at any place of the CAMS Europe
# domain. Seven LightGBM boosters, one per lead, trained on the 21 cities' 2014-2023 (ERA5 as a
# perfect forecast, CAMS's stream as the past where it exists), and their calibration: per lead,
# the quantiles of the errors of the country-held-out run on March 2024 to December 2025, the
# archived IFS runs as the forecast (`panache-forecast-experiment train`).
#
# The input table is the release `forecast-experiment-v1`'s; the models go to `forecast-models-v1`.
on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to train with"
        default: main

permissions:
  contents: read

env:
  SOURCE: forecast-experiment-v1
  RELEASE: forecast-models-v1

jobs:
  train:
    name: Train
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Fetch the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$SOURCE" --pattern forecast-experiment.parquet --dir inputs
      - name: Train
        run: |
          set -o pipefail
          /tmp/panache/bin/panache-forecast-experiment train \
            --data inputs/forecast-experiment.parquet --out out | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" \
              --title "Panache's PM2.5 forecast models, J+1 to J+7" \
              --notes-file docs/forecast-models-release.md --latest=false
          # The boosters first: the manifest names them.
          gh release upload "$RELEASE" out/lightgbm-j*.txt --clobber
          gh release upload "$RELEASE" out/forecast-models.json --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forecast-models
          path: out/
