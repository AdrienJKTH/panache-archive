name: Catch-up of the present's 1 km

# Panache's P7, step 3: the 1 km maps of NO2 and ozone (D127) from 1 January 2026 to yesterday,
# over the 18 countries, with the live models the pilot trained (the private dataset's
# downscaled-live-v1). One job a pollutant and month, each writing one `.days` file back there
# (`panache-downscaling-present-maps map`), ~2.4 GB in all (estimated from October). A month
# already there is skipped, so that a run takes up where another stopped. Nothing Panache computes
# is in a release, an artifact or the log (D114).

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache to run"
        default: main
      first:
        description: "The first day, ISO, a month's first"
        default: "2026-01-01"
      last:
        description: "The last day, ISO (default: yesterday)"
        default: ""
      pollutants:
        description: "The pollutants, a JSON list"
        default: '["nitrogen_dioxide", "ozone"]'

concurrency:
  group: present-catch-up
  cancel-in-progress: false

permissions:
  contents: read

env:
  FOLDER: downscaled-live-v1  # a folder of the private dataset

jobs:
  plan:
    name: Plan the months
    runs-on: ubuntu-24.04
    outputs:
      months: ${{ steps.plan.outputs.months }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
          POLLUTANTS: ${{ inputs.pollutants }}
        run: |
          last=${LAST:-$(date -u -d yesterday +%F)}
          built=$(uv run panache-archive private list --folder "$FOLDER")
          months="[]"
          first=$FIRST
          while [[ ! "$first" > "$last" ]]; do
            end=$(date -u -d "$first +1 month -1 day" +%F)
            if [[ "$end" > "$last" ]]; then end=$last; fi
            for pollutant in $(jq -r '.[]' <<< "$POLLUTANTS"); do
              if ! grep -qx "downscaled-$pollutant-present-$first-to-$end.days" <<< "$built"; then
                months=$(jq -c --arg p "$pollutant" --arg f "$first" --arg l "$end" \
                  '. + [{pollutant: $p, first: $f, last: $l}]' <<< "$months")
              fi
            done
            first=$(date -u -d "$first +1 month" +%F)
          done
          echo "months=$months" >> "$GITHUB_OUTPUT"
          echo "$(jq length <<< "$months") pollutant-months to map, to $last" >> "$GITHUB_STEP_SUMMARY"

  map:
    name: ${{ matrix.pollutant }} from ${{ matrix.first }}
    needs: plan
    if: needs.plan.outputs.months != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.months) }}
    env:
      POLLUTANT: ${{ matrix.pollutant }}
      FIRST: ${{ matrix.first }}
      LAST: ${{ matrix.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - name: Install the archive's tools
        run: uv sync --locked
      - name: Fetch the fixed layers and the live model
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          gh release download downscaling-europe-v1 --repo "$GITHUB_REPOSITORY" --dir inputs \
            --pattern static-europe-1km.npz
          uv run panache-archive private download --folder "$FOLDER" \
            --pattern "downscaling-present-$POLLUTANT.lgb.txt" --dir models
      - name: Map the month
        run: |
          [ -x /usr/bin/time ] || sudo apt-get install -y -q time > /dev/null
          /usr/bin/time -v -o map.txt /tmp/panache/bin/panache-downscaling-present-maps map \
            --europe inputs --pollutant "$POLLUTANT" --models models --first "$FIRST" \
            --last "$LAST" --out maps | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Elapsed|Maximum resident" map.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the month, privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run panache-archive private upload --folder "$FOLDER" maps/*
