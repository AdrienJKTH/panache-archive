name: CAMS
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('CAMS {0}', inputs.domain)
  || github.event.pull_request.title }}

# Builds the archive's CAMS assets on GitHub's machines: each downloads whole European months
# from the ADS (~0.8 GB each), keeps a domain's daily statistics and publishes them to its
# release: France's (~8 MB a year, `cams-v1`) or the whole domain's (~150 MB a year, frames,
# `cams-europe-v1`). A run builds only what the release lacks, so it can be run again after a
# failure. Labelling a pull request `pilot` tries its code on February 2021 first.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "`france` (Parquet, cams-v1) or `europe`, the whole domain (cams-europe-v1)"
        type: choice
        options: [france, europe]
        default: france
      variables:
        description: "`all`, or Open-Meteo names separated by commas, such as pm10,ozone"
        default: all
      years:
        description: "`all`, a year, or a span such as 2013-2025"
        default: all
      skip:
        description: Assets to leave out, separated by commas (the supervisor's stuck ones)
        default: ""
  pull_request:
    types: [labeled]

concurrency:
  group: >-
    cams-${{ github.event_name == 'workflow_dispatch' && format('build-{0}', inputs.domain)
    || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: ${{ inputs.domain || 'france' }}
  RELEASE: ${{ inputs.domain == 'europe' && 'cams-europe-v1' || 'cams-v1' }}
  NOTES: ${{ inputs.domain == 'europe' && 'docs/cams-europe-release.md' || 'docs/cams-release.md' }}
  TITLE: >-
    ${{ inputs.domain == 'europe' && 'CAMS Europe daily means over the whole domain'
    || 'CAMS Europe daily means over France' }}
  CDSAPI_URL: https://ads.atmosphere.copernicus.eu/api

jobs:
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$RELEASE" > /dev/null 2>&1
          || gh release create "$RELEASE" --title "$TITLE" --notes-file "$NOTES"
      - name: List the assets already built
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE" --json assets --jq '.assets[].name' > built.txt
      - name: Plan
        id: plan
        env:
          VARIABLES: ${{ inputs.variables }}
          YEARS: ${{ inputs.years }}
          SKIP: ${{ inputs.skip }}
        run: |
          matrix=$(uv run panache-archive plan --variables "$VARIABLES" --years "$YEARS"             --built built.txt --skip "$SKIP" --domain "$DOMAIN")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '"\(length) assets to build"' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.asset }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      actions: write # wake the supervisor up
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Build
        env:
          CDSAPI_KEY: ${{ secrets.ADS_KEY }}
          VARIABLE: ${{ matrix.variable }}
          YEAR: ${{ matrix.year }}
          STREAM: ${{ matrix.stream }}
        run: >
          uv run panache-archive build --variable "$VARIABLE" --year "$YEAR" --stream "$STREAM"
          --domain "$DOMAIN" --out dist --workdir "$RUNNER_TEMP"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE" dist/cams-* --clobber
      - name: Fetch France's twin
        # The whole domain's asset must hold France's very numbers (`check --twins`).
        if: env.DOMAIN == 'europe'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: >
          gh release download cams-v1 --pattern "${ASSET%.cells}.parquet" --dir twins
          || echo "France has no twin of $ASSET"
      - name: Check against Open-Meteo
        run: >
          uv run panache-archive check dist/cams-* --twins twins
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Wake the supervisor up
        # Its report then follows each asset; GitHub keeps one pending run of a concurrency
        # group, so jobs ending together cost one report. The 15-minute cron stays a fallback.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run supervise.yml --ref main

  pilot:
    name: Pilot, February 2021
    if: github.event_name == 'pull_request' && github.event.label.name == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Build PM10 and ozone for February 2021, over France and the whole domain
        env:
          CDSAPI_KEY: ${{ secrets.ADS_KEY }}
        run: |
          [ -x /usr/bin/time ] || sudo apt-get install -y -q time > /dev/null
          { echo '| Asset | Wall time | Peak memory |'; echo '|---|---|---|'; } > builds.md
          build() {
            /usr/bin/time -f "%e %M" -o took.txt uv run panache-archive build "$@" \
              --out dist --workdir "$RUNNER_TEMP" > built.txt
            read -r seconds kilobytes < took.txt
            echo "| $(basename "$(cat built.txt)") | ${seconds} s | $((kilobytes / 1024)) MB |" \
              >> builds.md
          }
          for variable in pm10 ozone; do
            for domain in france europe; do
              build --variable "$variable" --year 2021 --months 2 --domain "$domain"
            done
          done
          # 2019 lies on the old grid (x.x0°): its shape over the whole domain.
          build --variable pm10 --year 2019 --months 2 --domain europe
          { cat builds.md; echo; echo '| Asset | Size |'; echo '|---|---|'
            du -h dist/cams-* | awk '{ sub("dist/", "", $2); print "| " $2 " | " $1 " |" }'
            echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check against Open-Meteo and France's assets
        run: >
          uv run panache-archive check dist/cams-* --twins dist
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot
          path: dist/
          if-no-files-found: ignore
