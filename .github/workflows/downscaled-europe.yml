name: Downscaled maps, Europe

# Builds Panache's daily maps at 1 km over the land of the 18 countries of downscaling-europe-v1
# (Panache's D79) into the release downscaled-europe-v1; France's downscaled-v1 stays as it is.
# Panache's own backend builds them (`panache-downscaling-maps --europe`, checked out at the commit
# asked with the deploy key PANACHE_DEPLOY_KEY, Panache's repository being private): each
# pollutant's model is trained once on the background stations of every country, reading CAMS and
# ERA5 over the whole domain (cams-europe-v1, era5-europe-v1) a year at a time, in memory. A year
# of ~7.8 million cells a day outlasts a job's 6 hours (~85 s a day, ~8.6 hours a year), so each
# pollutant-year is shared between `parts` jobs: each publishes its part, and the last one in joins
# them into the year's `.days` file and drops them, so that a year shows as soon as it is built and
# a failed part holds back its year alone. The latest years come first, and at most 16 jobs run at
# once, leaving GitHub's other 4 to the live maps and the supervisor. The defaults are what Adrien
# approved on 2026-11-07: NO₂ in 2025 first, then "il faut tout", every pollutant and year. With
# `days`, a pilot builds the year's first days, shared between the parts as a year is, and keeps
# the model and the maps as the run's artifacts, the release untouched.

on:
  workflow_dispatch:
    inputs:
      panache:
        description: "The commit, branch or tag of AdrienJKTH/panache whose backend builds the maps"
        default: main
      years:
        description: "A year, or a span such as 2023-2025, built from the latest"
        default: "2013-2025"
      pollutants:
        description: "The pollutants to map, a JSON list"
        default: '["nitrogen_dioxide", "pm2_5", "pm10", "ozone"]'
      parts:
        description: "The jobs a pollutant-year is shared between, each under 6 hours"
        default: "3"
      days:
        description: "Only the year's first days, shared between the parts (a pilot); empty for all"
        default: ""

concurrency:
  group: downscaled-europe
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE: downscaled-europe-v1
  INPUTS: downscaling-europe-v1
  POLLUTANTS: ${{ inputs.pollutants }}
  DAYS: ${{ inputs.days }}

jobs:
  train:
    name: Train the models
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      years: ${{ steps.plan.outputs.years }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
          [ -x /usr/bin/time ] || sudo apt-get install -y -q time > /dev/null
      - name: Make sure the release exists
        if: env.DAYS == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$RELEASE" > /dev/null 2>&1
          || gh release create "$RELEASE"
          --title "The air quality index's pollutants at 1 km over 18 countries of Europe"
          --notes-file docs/downscaled-europe-release.md
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          YEARS: ${{ inputs.years }}
          PARTS: ${{ inputs.parts }}
        run: |
          case "$YEARS" in
            *-*) first=${YEARS%-*} last=${YEARS#*-} ;;
            *) first=$YEARS last=$YEARS ;;
          esac
          built=$(gh release view "$RELEASE" --json assets --jq '.assets[].name' 2>/dev/null || true)
          years=$(jq -nc --argjson first "$first" --argjson last "$last" --arg built "$built" \
            --arg pilot "$DAYS" --argjson pollutants "$POLLUTANTS" '
            [range($last; $first - 1; -1) as $year
             | $pollutants[] as $pollutant
             | select($pilot != ""
                 or (($built | split("\n")) | index("downscaled-\($pollutant)-\($year).days") | not))
             | {pollutant: $pollutant, year: $year}]')
          parts=$(jq -c --argjson of "$PARTS" \
            '[.[] as $year | range(1; $of + 1) as $part | $year + {part: $part, of: $of}]' \
            <<< "$years")
          echo "years=$years" >> "$GITHUB_OUTPUT"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          jq -r --argjson of "$PARTS" '"\(length) pollutant-years to build, \($of) parts each"' \
            <<< "$years" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch the stations and the fixed layers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pollutant in $(jq -r '.[]' <<< "$POLLUTANTS"); do
            gh release download "$INPUTS" --dir inputs --pattern "stations-*-$pollutant.parquet"
          done
          gh release download "$INPUTS" --dir inputs --pattern static-europe-1km.npz
      - name: Train the models the release lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          # A published model stays: the maps built with it would no longer match a new one. A
          # pilot trains its own, and keeps it as an artifact.
          missing=()
          for pollutant in $(jq -r '.[]' <<< "$POLLUTANTS"); do
            model="downscaling-$pollutant.lgb.txt"
            if [ -z "$DAYS" ] && gh release download "$RELEASE" --pattern "$model" --dir models
            then
              continue
            fi
            missing+=("$pollutant")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            /usr/bin/time -v -o train-time.txt /tmp/panache/bin/panache-downscaling-maps \
              --europe inputs train --pollutants "${missing[@]}" --out models
            grep -E "Elapsed|Maximum resident" train-time.txt >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$DAYS" ]; then
              for pollutant in "${missing[@]}"; do
                gh release upload "$RELEASE" "models/downscaling-$pollutant.lgb.txt"
              done
            fi
          fi
          echo "Trained: ${missing[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: models
          path: models/
          retention-days: 3

  build:
    name: ${{ matrix.pollutant }} ${{ matrix.year }}, part ${{ matrix.part }} of ${{ matrix.of }}
    needs: train
    if: needs.train.outputs.parts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.train.outputs.parts) }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
          [ -x /usr/bin/time ] || sudo apt-get install -y -q time > /dev/null
      - name: Fetch the fixed layers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download "$INPUTS" --repo "$GITHUB_REPOSITORY" --dir inputs
          --pattern static-europe-1km.npz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models
          path: models
      - name: Build
        env:
          POLLUTANT: ${{ matrix.pollutant }}
          YEAR: ${{ matrix.year }}
          PART: ${{ matrix.part }}/${{ matrix.of }}
        run: |
          /usr/bin/time -v -o time.txt /tmp/panache/bin/panache-downscaling-maps --europe inputs \
            year --pollutant "$POLLUTANT" --year "$YEAR" --models models --part "$PART" \
            ${DAYS:+--days "$DAYS"} --out dist
          grep -E "Elapsed|Maximum resident" time.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the part, and the year once its parts are all in
        if: env.DAYS == ''
        env:
          GH_TOKEN: ${{ github.token }}
          POLLUTANT: ${{ matrix.pollutant }}
          YEAR: ${{ matrix.year }}
          OF: ${{ matrix.of }}
        run: |
          stem="downscaled-$POLLUTANT-$YEAR"
          listed() {
            gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name'
          }
          gh release upload "$RELEASE" dist/"$stem"-part*.days --repo "$GITHUB_REPOSITORY" \
            --clobber
          names=$(listed)
          for part in $(seq 1 "$OF"); do
            if ! grep -qx "$stem-part$part.days" <<< "$names"; then
              echo "Part $part of $OF is not in yet: the last part in joins the year." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          # Two parts ending together may both join: the same file is then uploaded twice, and
          # one may find the parts already dropped by the other.
          if ! gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir parts \
            --pattern "$stem-part*.days"; then
            grep -qx "$stem.days" <<< "$(listed)" && exit 0
            exit 1
          fi
          mapfile -t parts < <(ls parts/"$stem"-part*.days | sort -V)
          /tmp/panache/bin/panache-downscaling-maps join --pollutant "$POLLUTANT" --year "$YEAR" \
            --parts "${parts[@]}" --out joined
          gh release upload "$RELEASE" "joined/$stem.days" --repo "$GITHUB_REPOSITORY" --clobber
          for part in $(seq 1 "$OF"); do
            gh release delete-asset "$RELEASE" "$stem-part$part.days" --repo "$GITHUB_REPOSITORY" \
              --yes || true
          done
          du -h "joined/$stem.days" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep as the pilot's artifact
        if: env.DAYS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-${{ matrix.pollutant }}-${{ matrix.year }}-${{ matrix.part }}
          path: dist/
          retention-days: 3
          compression-level: 0 # zstd already

  join:
    name: Join the pilot's ${{ matrix.pollutant }} ${{ matrix.year }}
    needs: [train, build]
    if: inputs.days != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.train.outputs.years) }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: ${{ inputs.panache }}
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-${{ matrix.pollutant }}-${{ matrix.year }}-*
          path: parts
          merge-multiple: true
      - name: Join
        env:
          POLLUTANT: ${{ matrix.pollutant }}
          YEAR: ${{ matrix.year }}
        run: |
          mapfile -t parts < <(ls parts/downscaled-"$POLLUTANT"-"$YEAR"-part*.days | sort -V)
          /tmp/panache/bin/panache-downscaling-maps join --pollutant "$POLLUTANT" --year "$YEAR" \
            --parts "${parts[@]}" --out dist
          du -h dist/*.days | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep as the pilot's artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downscaled-${{ matrix.pollutant }}-${{ matrix.year }}
          path: dist/
          retention-days: 7
          compression-level: 0
