name: Source targets

# Builds the measured targets of Panache's feature 4 in its public version (wood smoke or
# traffic, Panache's D87) into the release sources-v1: the organic aerosol factors of Chen et al.
# 2022 at 22 European sites and RI-URBANS's black carbon, by source where it is split, both
# CC BY 4.0 on Zenodo, as daily UTC means (`panache-archive targets`). Labelling a pull request
# `pilot-sources` surveys both records' files and builds the assets as the run's artifacts,
# without touching the release; labelling it `pilot-combustion` builds them and runs Panache's
# combustion experiment on them (`panache-combustion-experiment`, Panache's D87).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE: sources-v1
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'pilot-sources'
      || github.event.label.name == 'pilot-combustion'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Build
        run: uv run panache-archive targets --out dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" --title "Measured sources of carbonaceous aerosol" \
              --notes-file docs/sources-release.md
          gh release upload "$RELEASE" dist/*.parquet --clobber
      - name: Keep as the pilot's artifact
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: dist/
          retention-days: 7

  survey:
    name: Survey
    if: github.event.label.name == 'pilot-sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Survey
        run: >
          uv run --no-project --with openpyxl python -I scripts/survey_sources.py
          "$RUNNER_TEMP/sources" "$RUNNER_TEMP/survey.txt"
      - name: Report the files' size
        run: du -sh "$RUNNER_TEMP"/sources/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survey
          path: ${{ runner.temp }}/survey.txt
          retention-days: 7

  experiment:
    name: Combustion experiment
    needs: build
    if: github.event.label.name == 'pilot-combustion'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check out Panache
        # Panache's repository is private: a read-only deploy key on it, whose private half is
        # this repository's secret PANACHE_DEPLOY_KEY.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdrienJKTH/panache
          ref: main
          ssh-key: ${{ secrets.PANACHE_DEPLOY_KEY }}
          path: panache
          persist-credentials: false
      - name: Install Panache's backend
        run: |
          uv venv /tmp/panache --python 3.12
          uv pip install --python /tmp/panache/bin/python ./panache/backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: inputs
      - name: Fetch the fixed layers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download downscaling-europe-v1 --repo "$GITHUB_REPOSITORY" --dir static
          --pattern "static-europe-1km.npz"
      - name: Experiment
        run: |
          mkdir -p out
          /tmp/panache/bin/panache-combustion-experiment --inputs inputs \
            --static static/static-europe-1km.npz --tracers --out out/combustion.json \
            | tee out/combustion.md
          cat out/combustion.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: combustion
          path: out/
          retention-days: 14
