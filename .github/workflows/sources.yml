name: Source targets

# Builds the measured targets of Panache's feature 4 in its public version (wood smoke or
# traffic, Panache's D87) into the release sources-v1: the organic aerosol factors of Chen et al.
# 2022 at 22 European sites and RI-URBANS's black carbon by source at 50 urban stations, both
# CC BY 4.0 on Zenodo. Labelling a pull request `pilot-sources` surveys both records' files as
# the run's artifact, without touching the release.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  survey:
    name: Survey
    if: github.event.label.name == 'pilot-sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Survey
        run: >
          uv run --no-project --with openpyxl python -I scripts/survey_sources.py
          "$RUNNER_TEMP/sources" "$RUNNER_TEMP/survey.txt"
      - name: Report the files' size
        run: du -sh "$RUNNER_TEMP"/sources/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survey
          path: ${{ runner.temp }}/survey.txt
          retention-days: 7
